[project]
name = "finn-backend"
version = "0.1.0"
requires-python = ">=3.12"
# The API's dependencies only (Vercel installs these). Jobs and tests use requirements.txt.
dependencies = [
  "beautifulsoup4==4.15.0",
  "fastapi==0.162.0",
  "lxml==6.1.3",
  "psycopg[binary]==3.3.7",
  "pypdfium2==5.14.0",
  "python-dotenv==1.2.4",
  "requests==2.34.2",
]

[tool.vercel]
entrypoint = "finn_api.main:app"
