name: keepalive

# Supabase pauses free projects after 7 idle days; this touches the database and pings the API twice a week.
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API health
        run: curl -fsS --max-time 60 https://finn-api-khaki.vercel.app/health
      - name: Touch the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::notice::SUPABASE_DB_URL not set"; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -c "insert into meta (key, value, updated_at) values ('keepalive', to_jsonb(now()), now())
                                      on conflict (key) do update set value = excluded.value, updated_at = now()"
