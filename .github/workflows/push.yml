name: push

# Filings poll every 15 min from ~07:30 to 23:30 IST (results often land after the close), hourly overnight;
# end-of-day prices at 17:30 IST on weekdays. GitHub's cron is UTC and can run a few minutes late.
on:
  schedule:
    - cron: "*/15 2-17 * * *"
    - cron: "0 18-23,0-1 * * *"
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "poll, eod or both"
        default: "both"
      since:
        description: "poll window, e.g. 7d (blank = since last poll)"
        default: ""

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINN_USE_NSE: "1"
      FINN_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: finn-cache-${{ github.run_id }}
          restore-keys: finn-cache-
      - name: Source check (can this runner reach NSE?)
        id: sources
        continue-on-error: true
        run: python -m jobs.source_check
      - name: Skip if the database isn't configured yet
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice::SUPABASE_DB_URL secret not set; jobs skipped."
      - name: EOD prices
        if: env.SUPABASE_DB_URL != '' && (github.event.schedule == '0 12 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.job != 'poll'))
        run: python -m jobs.eod
      - name: Poll filings
        if: env.SUPABASE_DB_URL != '' && ((github.event_name == 'schedule' && github.event.schedule != '0 12 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.job != 'eod'))
        run: python -m jobs.poll ${{ inputs.since && format('--since {0}', inputs.since) || '' }}
